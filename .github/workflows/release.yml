name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate release source
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(awk '/^\[package\]/{package=1; next} package && /^version = /{gsub(/[\" ]/, "", $3); print $3; exit}' src-tauri/Cargo.toml)"
          cargo_lock_version="$(awk '/^name = "justpaper"$/{package=1; next} package && /^version = /{gsub(/[\" ]/, "", $3); print $3; exit}' src-tauri/Cargo.lock)"
          pkgbuild_version="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          srcinfo_version="$(sed -n 's/^\tpkgver = //p' packaging/arch/.SRCINFO)"
          test "$version" = "$lock_version"
          test "$version" = "$tauri_version"
          test "$version" = "$cargo_version"
          test "$version" = "$cargo_lock_version"
          test "$version" = "$pkgbuild_version"
          test "$version" = "$srcinfo_version"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$GITHUB_REF_NAME" = "main"
          fi
          git fetch --no-tags origin main
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: validate-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-release.outputs.sha }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable on 2026-09-04
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test

      - name: Write App Store Connect API key
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and publish non-macOS release
        if: matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: JustPaper v__VERSION__
          releaseBody: |
            Binaries for macOS (Apple Silicon), Windows, Ubuntu (.deb), and Linux (AppImage/RPM).

            macOS is signed with Developer ID and notarized.
            Homebrew: `brew tap frankhildebrandt/justpaper && brew install --cask justpaper`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json

      - name: Build, sign, notarize, and publish macOS release
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: JustPaper v__VERSION__
          releaseBody: |
            Binaries for macOS (Apple Silicon), Windows, Ubuntu (.deb), and Linux (AppImage/RPM).

            macOS is signed with Developer ID and notarized.
            Homebrew: `brew tap frankhildebrandt/justpaper && brew install --cask justpaper`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json

  update-cask:
    needs: publish-tauri
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Update Homebrew cask and Arch checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/update-cask.sh "${GITHUB_REF_NAME#v}"
      - name: Commit packaging metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/justpaper.rb packaging/arch/PKGBUILD packaging/arch/.SRCINFO
          if git diff --cached --quiet; then
            echo "no packaging changes"
            exit 0
          fi
          git commit -m "Update cask and Arch checksums for ${GITHUB_REF_NAME}."
          git push

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: JustPaper v__VERSION__
          releaseBody: |
            Binaries for macOS (Apple Silicon and Intel), Windows, Ubuntu (.deb), and Linux (AppImage/RPM).

            macOS: unsigned builds need a right-click → Open the first time.
            Homebrew: `brew tap frankhildebrandt/justpaper && brew install --cask justpaper`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  update-cask:
    needs: publish-tauri
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Homebrew cask and Arch checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/update-cask.sh "${GITHUB_REF_NAME#v}"
      - name: Commit packaging metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/justpaper.rb packaging/arch/PKGBUILD
          if git diff --cached --quiet; then
            echo "no packaging changes"
            exit 0
          fi
          git commit -m "Update cask and Arch checksums for ${GITHUB_REF_NAME}."
          git push

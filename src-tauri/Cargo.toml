[package]
name = "justpaper"
version = "0.3.2"
description = "A frameless typewriter on paper"
authors = ["Frank Hildebrandt"]
license = "AGPL-3.0-only"
repository = "https://github.com/frankhildebrandt/JustPaper"
edition = "2021"

[lib]
name = "justpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-opener = "2"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
